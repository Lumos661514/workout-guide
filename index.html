<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<meta name="apple-mobile-web-app-title" content="动作手册" />
<meta name="theme-color" content="#0f1419" />
<meta name="description" content="按部位查看健身动作要点，离线可用" />

<title>动作讲解手册</title>
<style>
:root {
  --bg: #0f1419;
  --bg2: #161d27;
  --card: #1a2332;
  --card2: #222d3f;
  --line: #2a3548;
  --text: #e8eef7;
  --muted: #8b9bb4;
  --accent: #3dd68c;
  --accent2: #5eead4;
  --warn: #f0b429;
  --danger: #f07178;
  --radius: 14px;
  --tap: 48px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  min-height: 100%;
}
body { padding-bottom: calc(16px + var(--safe-bot)); }
button, input { font: inherit; color: inherit; }
a { color: var(--accent2); }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
}

.top {
  position: sticky; top: 0; z-index: 20;
  background: rgba(15,20,25,.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + var(--safe-top)) 14px 12px;
}
.top-row {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--tap);
}
.back {
  display: none;
  align-items: center; justify-content: center;
  width: var(--tap); height: var(--tap);
  border: 0; border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  flex-shrink: 0;
}
.back.show { display: inline-flex; }
.titles { flex: 1; min-width: 0; }
.titles h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.titles .sub {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}
.search-wrap { margin-top: 10px; position: relative; }
.search-wrap input {
  width: 100%;
  height: 44px;
  padding: 0 14px 0 40px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  outline: none;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .ico {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none; font-size: 16px;
}

.main { padding: 14px; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.part-card {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
  min-height: 92px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, var(--card), var(--bg2));
  cursor: pointer;
  text-align: left;
  transition: transform .12s ease, border-color .12s;
}
.part-card:active { transform: scale(.98); }
.part-card .emoji { font-size: 26px; line-height: 1; margin-bottom: 8px; }
.part-card .name { font-size: 17px; font-weight: 700; }
.part-card .count { margin-top: 6px; font-size: 12px; color: var(--muted); }

.list { display: flex; flex-direction: column; gap: 8px; }
.ex-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  min-height: var(--tap);
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  cursor: pointer;
  text-align: left;
}
.ex-row:active { background: var(--card2); }
.ex-row .meta { flex: 1; min-width: 0; }
.ex-row .cn { font-weight: 650; font-size: 16px; }
.ex-row .en { font-size: 12px; color: var(--muted); margin-top: 2px; }
.chip {
  display: inline-flex; align-items: center;
  padding: 4px 8px;
  border-radius: 999px;
  background: #243247;
  color: var(--accent2);
  font-size: 11px;
  white-space: nowrap;
  flex-shrink: 0;
}
.chev { color: var(--muted); font-size: 18px; flex-shrink: 0; }

.detail {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  padding: 16px;
}
.detail .en { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.detail .equip {
  display: inline-flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
}
.detail h3 {
  margin: 0 0 8px;
  font-size: 14px;
  color: var(--accent);
  letter-spacing: .04em;
}
.detail ul {
  margin: 0 0 16px;
  padding-left: 18px;
}
.detail li { margin: 6px 0; color: var(--text); }
.detail li.warn { color: #ffd58a; }
.empty {
  text-align: center;
  color: var(--muted);
  padding: 40px 16px;
}
.hint {
  margin-top: 18px;
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--bg2);
  border: 1px dashed var(--line);
  color: var(--muted);
  font-size: 13px;
}
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

      <div class="titles">

        <p class="sub" id="subtitle">点部位查看动作 · 可搜索</p>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <span class="ico" aria-hidden="true">⌕</span>
      <input id="search" type="search" enterkeyhint="search" placeholder="搜索动作，如 卧推 / squat" autocomplete="off" />
    </div>
  </header>
  <main class="main" id="main"></main>
</div>

const state = { view: 'home', partId: null, exIndex: null, q: '' };

const $main = document.getElementById('main');
const $title = document.getElementById('title');
const $sub = document.getElementById('subtitle');
const $back = document.getElementById('backBtn');
const $search = document.getElementById('search');
const $searchWrap = document.getElementById('searchWrap');

function partById(id) { return PARTS.find(p => p.id === id); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHome() {
  $title.textContent = '动作讲解手册';
  $sub.textContent = '点部位查看动作 · 可搜索';
  $back.classList.remove('show');
  $searchWrap.classList.remove('hidden');

  if (state.q.trim()) {
    renderSearchResults(state.q.trim());
    return;
  }

  const cards = PARTS.map(p => {
    const n = (EXERCISES[p.id] || []).length;
    return `<button type="button" class="part-card" data-part="${p.id}">
      <span class="emoji">${p.emoji}</span>
      <span class="name">${p.name}</span>
      <span class="count">${n} 个动作</span>
    </button>`;
  }).join('');

  $main.innerHTML = `<div class="grid">${cards}</div>
    <p class="hint">提示：Safari 打开后点分享 →「添加到主屏幕」，下次像 App 一样点开。内容已内置，无网络也能看。</p>`;

  $main.querySelectorAll('[data-part]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = 'list';
      state.partId = btn.dataset.part;
      state.exIndex = null;
      render();
    });
  });
}

function renderList() {
  const part = partById(state.partId);
  const list = EXERCISES[state.partId] || [];
  $title.textContent = part ? part.name : '动作';
  $sub.textContent = `${list.length} 个常用动作`;
  $back.classList.add('show');
  $searchWrap.classList.add('hidden');

  const rows = list.map((ex, i) => `
    <button type="button" class="ex-row" data-i="${i}">
      <div class="meta">
        <div class="cn">${escapeHtml(ex.cn)}</div>
        <div class="en">${escapeHtml(ex.en || '')}</div>
      </div>
      <span class="chip">${escapeHtml(ex.eq)}</span>
      <span class="chev">›</span>
    </button>`).join('');

  $main.innerHTML = `<div class="list">${rows}</div>`;
  $main.querySelectorAll('[data-i]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = 'detail';
      state.exIndex = Number(btn.dataset.i);
      render();
    });
  });
}

function renderDetail() {
  const part = partById(state.partId);
  const ex = (EXERCISES[state.partId] || [])[state.exIndex];
  if (!ex) { state.view = 'list'; render(); return; }

  $title.textContent = ex.cn;
  $sub.textContent = part ? part.name : '';
  $back.classList.add('show');
  $searchWrap.classList.add('hidden');

  const cues = ex.cues.map((c, idx) => {
    const isErr = /常见错误/.test(c);
    return `<li class="${isErr ? 'warn' : ''}">${escapeHtml(c)}</li>`;
  }).join('');

  $main.innerHTML = `<article class="detail">
    <div class="en">${escapeHtml(ex.en || '')}</div>
    <div class="equip"><span class="chip">${escapeHtml(ex.eq)}</span></div>
    <h3>要点</h3>
    <ul>${cues}</ul>
  </article>`;
}

function renderSearchResults(q) {
  const qq = q.toLowerCase();
  const hits = [];
  PARTS.forEach(p => {
    (EXERCISES[p.id] || []).forEach((ex, i) => {
      const blob = `${ex.cn} ${ex.en} ${ex.eq} ${p.name}`.toLowerCase();
      if (blob.includes(qq)) hits.push({ partId: p.id, partName: p.name, i, ex });
    });
  });

  $title.textContent = '搜索结果';
  $sub.textContent = hits.length ? `找到 ${hits.length} 个` : '没有匹配';
  $back.classList.remove('show');

  if (!hits.length) {
    $main.innerHTML = `<div class="empty">没有找到「${escapeHtml(q)}」相关动作</div>`;
    return;
  }

  const rows = hits.map(h => `
    <button type="button" class="ex-row" data-part="${h.partId}" data-i="${h.i}">
      <div class="meta">
        <div class="cn">${escapeHtml(h.ex.cn)}</div>
        <div class="en">${escapeHtml(h.partName)} · ${escapeHtml(h.ex.en || '')}</div>
      </div>
      <span class="chip">${escapeHtml(h.ex.eq)}</span>
      <span class="chev">›</span>
    </button>`).join('');

  $main.innerHTML = `<div class="list">${rows}</div>`;
  $main.querySelectorAll('[data-part]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = 'detail';
      state.partId = btn.dataset.part;
      state.exIndex = Number(btn.dataset.i);
      state.q = '';
      $search.value = '';
      render();
    });
  });
}

function render() {
  if (state.view === 'home') renderHome();
  else if (state.view === 'list') renderList();
  else renderDetail();
  window.scrollTo(0, 0);
}

$back.addEventListener('click', () => {
  if (state.view === 'detail') { state.view = 'list'; state.exIndex = null; }
  else { state.view = 'home'; state.partId = null; }
  render();
});

let searchTimer;
$search.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = $search.value;
    state.view = 'home';
    state.partId = null;
    state.exIndex = null;
    render();
  }, 120);
});

render();
</script>
